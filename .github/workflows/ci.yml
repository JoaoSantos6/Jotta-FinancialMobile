name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  # Fixada, não "stable" flutuante — um bump do canal não pode quebrar a CI
  # sem que ninguém tenha pedido (guarda-chuva §5.9).
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # T-44: sem isto, os testes do Bloco C (T-14 a T-19) falham — PRAGMA
      # key seria aceito por uma SQLite comum e ninguém perceberia. A prova
      # de que esta etapa é necessária é a própria suíte: removê-la reprova
      # exatamente os testes de core/database/.
      - name: Instala libsqlcipher
        run: sudo apt-get update -y && sudo apt-get install -y libsqlcipher-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Instala dependências
        run: flutter pub get

      - name: Gera código (Drift, Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      # T-45: guarda-chuva §5.9 — analyze, format, testes da suíte inteira.
      - name: flutter analyze
        run: flutter analyze

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed .

      - name: flutter test --coverage
        run: flutter test --coverage

      - name: Trava - material da chave e log de valor monetário
        run: ./tool/ci/check_logs.sh

  build-and-check-manifest:
    name: Build APK e travas de manifest
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Instala dependências
        run: flutter pub get

      - name: Gera código (Drift, Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      # T-46: o artefato que as travas de manifest seguintes leem. O build
      # falha por si só se o APK não sair — não precisa de checagem extra.
      - name: flutter build apk --debug
        run: flutter build apk --debug

      # Provisório, enquanto investigamos a origem real de uma permissão
      # inesperada (ver achado em docs/DECISIONS.md): o relatório do
      # merge de manifest do AGP mostra, com comentário de proveniência,
      # de qual dependência cada permissão veio. O caminho
      # `build/outputs/logs/manifest-merger-debug-report.txt` não existe
      # nesta versão do AGP (confirmado em CI real, run 34005175742) — a
      # localização do relatório de blame mudou entre versões do AGP, então
      # procuramos em vez de fixar um caminho.
      - name: Debug - relatório do merge de manifest
        if: always()
        run: |
          find android/app/build -iname '*manifest-merger*' -o -iname '*manifest*blame*' 2>/dev/null | while read -r f; do
            echo "=== $f ==="
            cat "$f"
          done

      # Publica o APK ANTES da trava de manifest: o build em si (T-46) já
      # passou, e quem só quer instalar e olhar a tela não deveria ficar
      # bloqueado por uma trava de segurança que ainda pode estar
      # reprovando por engano nosso, não por permissão de verdade
      # introduzida por dependência. A trava roda de qualquer forma,
      # logo depois, e continua reprovando o job (e portanto o merge)
      # quando encontra algo real.
      - name: Publica o APK debug como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # T-47, T-48, T-49: leem o manifest MERGED (dentro do APK), não o
      # arquivo-fonte — uma dependência transitiva pode reintroduzir
      # allowBackup="true" ou uma permissão sem que uma linha do nosso
      # código mude (risco A4).
      - name: Trava - manifest (INTERNET, allowBackup, baseline de permissões)
        run: ./tool/ci/check_manifest.sh build/app/outputs/flutter-apk/app-debug.apk
